          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - ""
          resources:
          - events
          verbs:
          - create
          - patch
        serviceAccountName: hyper-ops-controller-manager
    strategy: deployment
  installModes:
  - supported: false
