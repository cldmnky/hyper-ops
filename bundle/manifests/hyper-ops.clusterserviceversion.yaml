          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - hyper-ops.cloudmonkey.org
          resources:
          - configs/finalizers
          verbs:
          - update
        - apiGroups:
          - hyper-ops.cloudmonkey.org
          resources:
          - configs/status
          verbs:
          - get
          - patch
          - update
